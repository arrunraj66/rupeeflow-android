name: Publish Arun One 2.0.1 Hotfix
on:
  push:
    branches: [codex/arun-one-alarm-smoke]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Arun-One-APK
          path: delivery
          run-id: 35968217342
          github-token: ${{ github.token }}
      - name: Verify corrected APK
        run: echo "23afbf0aa1d294312ce9b29892cbddbfec0de06e4a0058569d328c86938b4e60  delivery/Arun-One-2.0.1-Hotfix.apk" | sha256sum -c -
      - name: Publish hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: arrunraj66/rupeeflow-android
        run: |
          if gh release view v2.0.1-hotfix >/dev/null 2>&1; then
            gh release upload v2.0.1-hotfix delivery/Arun-One-2.0.1-Hotfix.apk --clobber
          else
            gh release create v2.0.1-hotfix delivery/Arun-One-2.0.1-Hotfix.apk --target e619a8b078cacf433aada62ce7eecde195c8d761 --title "Arun One 2.0.1 Hotfix" --prerelease --notes "Fixes the immediate startup crash in version 2.0 caused by invalid raw text nodes on the Home screen. Also adds startup recovery, safer saved-data loading and permission error handling. Signed universal Android APK for Android 7 and newer."
          fi
